# Managed by %USERPROFILE%\Laboratory\firetv — see apps/manifest.md
accent=blue
tiles=medium
layout=rows
order=custom
labels=focus
clock=auto
inputs=on
switch=auto
background=image
dim=40
rotate=off
apps.order=com.saikou.sozo_tv,com.lumera.app,com.arvio.tv,st.atlantic.app,tv.streameast.web,org.smarttube.stable,com.s0und.s0undtv,com.kick.mobile,tv.mmabite.web,space.nicart.watchbox.tv,com.spyou.watch_app,tv.animeheaven.web,tv.miruro.web,tv.framextv.web,tv.obbywatcher.web,com.rumble.firetv,com.x.xtv,com.lagradost.cloudstream3,com.lonelycatgames.Xplore,com.neilturner.aerialviews,com.amazon.venezia,com.amazon.spiderpork,com.amazon.firebat
apps.show=com.amazon.venezia
# tv.framextv.web = WebView shell (apps/webwrap); com.nuvio.tv = native NuvioTV APK
# hidden from the home screen only — the apps still work
apps.hide=com.amazon.bueller.music,com.netflix.ninja,com.apple.airplay.amazon.airplay,com.amazon.spiderpork,com.amazon.firebat
# HDMI1 registered twice (CEC + port). Keep the port tile, name it for the device.
inputs.hide=com.droidlogic.tvinput/.services.Hdmi1InputService/HDMI100004
name.com.droidlogic.tvinput/.services.Hdmi1InputService/HW5=PlayStation 5
name.com.droidlogic.tvinput/.services.Hdmi2InputService/HW6=PC
# display-only rename; package is still org.smarttube.stable
name.org.smarttube.stable=YouTube
# display-only rename; package is still com.s0und.s0undtv
name.com.s0und.s0undtv=Twitch
