name = "rebel-live-front"
main = "src/index.js"
compatibility_date = "2026-11-01"

# The route replaces the old iptv.nuroctane.xyz CNAME to the dead named tunnel
# (rebel-iptv, 3fdc1414-...). Delete that DNS record before deploying.
routes = [{ pattern = "iptv.nuroctane.xyz", custom_domain = true }]

[[kv_namespaces]]
binding = "REBEL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"   # wrangler kv namespace create REBEL
