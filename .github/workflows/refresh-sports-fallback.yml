name: Refresh Sports fallback M3U

# Once a day. The merged playlist is direct URLs only (no signed tokens in
# the Tubi/Roku/Atlas sources), so a daily refresh is enough to pick up
# playlist rotations. Manual runs are available from the Actions tab
# (workflow_dispatch) whenever a fresh copy is wanted right now.
on:
  schedule:
    - cron: "0 17 * * *" # 17:00 UTC = 11:00 CT, before the evening games
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-sports-fallback.yml"
      - "provision/sports-fallback/**"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build merged M3U
        working-directory: provision/sports-fallback
        run: python3 scripts/build-fallback-m3u.py
      - name: Commit if changed
        run: |
          git config user.name "sports-fallback-bot"
          git config user.email "sports-fallback-bot@users.noreply.github.com"
          git add provision/sports-fallback/sports-fallback.m3u provision/sports-fallback/stats.json
          git diff --cached --quiet || git commit -m "refresh sports fallback M3U $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
